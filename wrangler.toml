name = "a-share-etf-rebound-alerts"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# Cloudflare Cron uses UTC. 08:15 UTC = 16:15 China Standard Time.
# Weekdays only; the worker also checks the exchange calendar / data availability.
[triggers]
crons = ["15 8 * * MON-FRI"]

[[d1_databases]]
binding = "DB"
database_name = "a-share-etf-alerts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
TIMEZONE = "Asia/Shanghai"
# Initial paper-trading configuration. No automatic orders are placed.
MAX_POSITION_PCT = "0.60"
RISK_PER_TRADE_PCT = "0.005"
MAX_HOLDING_DAYS = "20"
ENTRY_COOLDOWN_DAYS = "3"
# JSON array: [{symbol,name,secid}, ...]. SSE=1.xxxxx, SZSE=0.xxxxx
# Override anytime in CF Dashboard → Worker → Settings → Variables without redeploying code.
WATCHLIST = '[{"symbol":"510300","name":"沪深300ETF","secid":"1.510300"},{"symbol":"510050","name":"上证50ETF","secid":"1.510050"},{"symbol":"510500","name":"中证500ETF","secid":"1.510500"},{"symbol":"159915","name":"创业板ETF","secid":"0.159915"}]'
